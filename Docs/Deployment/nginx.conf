# Valour node nginx config (production reference).
# The upstream "valour_backend" is defined in upstream.conf (00-upstream.conf),
# which deploy-if-new.sh rewrites on each blue/green cutover.

# Handle Upgrade headers for WebSockets by switching between
# "Upgrade" and "keep-alive" dynamically.
map $http_connection $connection_upgrade {
  "~*Upgrade" $http_connection;
  default     keep-alive;
}

server {
    # Must be >= the largest upload tier (Stargazer Pro: 250 MB)
    client_max_body_size 250M;

    listen 443 ssl http2;

    server_name app.valour.gg cdn.valour.gg api.valour.gg threads.valour.gg wiki.valour.gg;

    # Cloudflare origin certificate
    ssl_certificate     /etc/nginx/ssl/valour.crt;
    ssl_certificate_key /etc/nginx/ssl/valour.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # -----------------------
    # Client address
    # -----------------------
    # Take the visitor's address from CF-Connecting-IP only when the
    # connection comes from Cloudflare. For any other peer, $remote_addr stays
    # the peer itself, so a client that reaches this server directly cannot
    # choose the address used for rate limiting. Keep this list in sync with
    # https://www.cloudflare.com/ips/.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # -----------------------
    # 1) Default location
    # -----------------------
    location / {
        proxy_pass         http://valour_backend;
        proxy_http_version 1.1;

        # Overwrite both address headers with the validated address instead of
        # passing on whatever the client sent.
        proxy_set_header Host               $host;
        proxy_set_header X-Forwarded-For    $remote_addr;
        proxy_set_header CF-Connecting-IP   $remote_addr;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # -----------------------
    # 2) SignalR WebSockets
    # -----------------------
    location /hubs/core {
        proxy_pass http://valour_backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache off;

        # Server-Sent Events
        proxy_buffering off;

        # If KeepAliveInterval or LongPolling is >60s, raise this
        proxy_read_timeout 100s;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header CF-Connecting-IP  $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP -> HTTPS redirection
server {
    listen 80;
    server_name app.valour.gg api.valour.gg threads.valour.gg wiki.valour.gg;

    location / {
        return 301 https://$host$request_uri;
    }
}
