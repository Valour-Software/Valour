<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Instrument Sans'; src: url('/Valour/Client/wwwroot/css/fonts/instrument-sans-latin.woff2') format('woff2'); font-weight: 400 700; }
@font-face { font-family: 'JetBrains Mono'; src: url('/Valour/Client/wwwroot/css/fonts/jetbrains-mono-latin.woff2') format('woff2'); font-weight: 400 700; }
body { margin: 0; background: transparent; }
#card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #0a0d12; font-family: 'Instrument Sans'; color: #e7ebf1; }
#card canvas { position: absolute; inset: 0; }
.scrim { position: absolute; inset: 0; background: linear-gradient(90deg, #0a0d12 30%, rgba(10,13,18,0) 72%); }
.copy { position: absolute; left: 84px; top: 92px; width: 860px; }
.brand { display: flex; align-items: center; gap: 18px; font-size: 38px; font-weight: 700; letter-spacing: -0.02em; }
.brand img { width: 72px; height: 72px; }
h1 { margin: 72px 0 0; font-size: 54px; font-weight: 600; line-height: 1.06; letter-spacing: -0.035em; }
h1 em { font-style: normal; color: #7d8696; }
h1 { text-shadow: 0 1px 3px rgb(0 0 0 / 0.7), 0 0 18px rgb(0 0 0 / 0.75), 0 0 42px rgb(0 0 0 / 0.65); }
.foot { position: absolute; left: 84px; bottom: 64px; font: 20px 'JetBrains Mono'; color: rgba(215,225,240,.62); }
.victor { position: absolute; left: 930px; top: 112px; width: 176px; transform: rotate(-6deg); }
.wm { display: inline-flex; align-items: center; gap: 28px; padding: 24px; font-family: 'Instrument Sans'; font-size: 120px; font-weight: 700; letter-spacing: -0.03em; }
.wm img { width: 150px; height: 150px; }
</style></head><body>
<div id="card"><canvas id="sky" width="1200" height="630"></canvas><canvas id="planet" width="1200" height="630"></canvas><div class="scrim"></div>
<img class="victor" src="/Valour/Client/wwwroot/media/victor/victor-astronaut.svg">
<div class="copy"><div class="brand"><img src="/media/socials/icon-outline.png">Valour</div><h1>Communities you can see.<br><em>Conversations only you can read.</em></h1></div>
<div class="foot">valour.gg · open source · end-to-end encrypted</div></div>
<div id="wm-dark" class="wm" style="color:#e7ebf1"><img src="/media/socials/icon-outline.png">Valour</div>
<div id="wm-light" class="wm" style="color:#0a0d12"><img src="/media/socials/icon-outline.png">Valour</div>
<script type="module">
import { resolveOptions, gasSize, computeGas, compose } from '/Valour/Client/wwwroot/js/nebula.js';
import { planetGenome, renderPlanet } from '/Valour/Client/wwwroot/js/planet.js';
const W = 1200, H = 630;
const o = resolveOptions({ seed: 'valour', palette: 'valour', intensity: 1.3, focusX: 0.72, focusY: 0.35, spread: 0.4, scale: 2.6, stars: 260 });
const { gw, gh, resolution } = gasSize(o, W, H);
compose(document.getElementById('sky'), o, computeGas(o, gw, gh, W, H), gw, gh, resolution);
const g = planetGenome('valour-home'); g.kind = 'terra'; g.rings = null; g.moons = [];
const base = 420, R = H * 0.5, f = R / base;
const { pixels, size } = renderPlanet(g, base, 1.4, [0.12, -0.38, -0.92]);
const cv = document.createElement('canvas'); cv.width = size; cv.height = size;
cv.getContext('2d').putImageData(new ImageData(pixels, size, size), 0, 0);
const ctx = document.getElementById('planet').getContext('2d'); ctx.imageSmoothingQuality = 'high';
ctx.drawImage(cv, W * 0.8 - size * f / 2, H * 1.19 - size * f / 2, size * f, size * f);
await document.fonts.ready;
document.body.dataset.done = '1';
</script></body></html>
