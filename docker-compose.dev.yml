# Local development data services: PostgreSQL and Redis for a server run from
# source (dotnet run or an IDE). This file does not run Valour itself. To host
# an instance, use docker-compose.yml instead.
#
#   docker compose -f docker-compose.dev.yml up -d      start
#   docker compose -f docker-compose.dev.yml down       stop, keep the data
#   docker compose -f docker-compose.dev.yml down -v    stop and delete the data
#
# Valour/Server/appsettings.Development.json points the server at these
# services. Both listen on this machine only, on ports that do not collide with
# a PostgreSQL or Redis already installed here. The credentials are fixed and
# public, so never expose these ports or store real data in this database.
name: valour-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: valour_dev
      POSTGRES_USER: valour
      POSTGRES_PASSWORD: valour_dev
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valour -d valour_dev"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:63790:6379"
    restart: unless-stopped

volumes:
  pgdata:
