name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Valour/Client.Maui/**'
      - 'Valour/Client/**'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
    - uses: actions/checkout@v4

    - name: Check if release already has Windows assets
      id: check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        CURRENT=$(grep -oP '(?<=<ApplicationDisplayVersion>)[^<]+' Valour/Client.Maui/Valour.Client.Maui.csproj)
        echo "version=$CURRENT" >> $GITHUB_OUTPUT

        # Gate on this platform's assets, not release existence: the release is
        # shared with other platform workflows, and a failed run must not block
        # rebuilding the same version after a fix is pushed.
        ASSETS=$(gh release view "v$CURRENT" --json assets -q '.assets[].name' 2>/dev/null || true)
        if echo "$ASSETS" | grep -qx 'Valour-windows-x64.zip' && echo "$ASSETS" | grep -qx 'Valour-full.zip' && echo "$ASSETS" | grep -qx 'ValourLauncher.exe'; then
          echo "Release v$CURRENT already has Windows assets, skipping build"
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "No complete Windows release for v$CURRENT, will build"
          echo "changed=true" >> $GITHUB_OUTPUT
        fi

  build-windows:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Restore Village release atlas
      run: python Tools/Villages/restore-release-assets.py

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # The installer needs the full SDK version; global.json names the release.
        dotnet-version: 11.0.100-rc.1.26425.128

    - name: Install MAUI workloads
      run: dotnet workload install maui-windows maui-android

    - name: Get short SHA
      id: short-sha
      shell: bash
      run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

    - name: Replace asset version hashes
      uses: mingjun97/file-regex-replace@v1
      with:
        regex: '\$\(SHORTHASH\)'
        replacement: '${{ steps.short-sha.outputs.short_sha }}'
        flags: "g"
        include: '\.(js|cs|razor|cshtml|html)$'
        exclude: '.^'
        encoding: 'utf8'
        path: '.'

    - name: Restore dependencies
      run: |
        dotnet restore Valour/BuildTools/CssBundler/CssBundler.csproj
        dotnet restore Valour/Client/Valour.Client.csproj

    - name: Build Client (generates CSS bundle)
      run: dotnet build Valour/Client/Valour.Client.csproj -c Release --no-restore

    - name: Publish Windows App
      run: >
        dotnet publish Valour/Client.Maui/Valour.Client.Maui.csproj
        -f net11.0-windows10.0.19041.0
        -c Release
        -o ./artifacts/windows
        -p:RuntimeIdentifierOverride=win10-x64
        -p:SelfContained=true
        -p:WindowsAppSDKSelfContained=true

    - name: Verify published assets
      shell: pwsh
      run: |
        if (!(Test-Path "./artifacts/windows/Valour.exe")) {
          throw "Expected ./artifacts/windows/Valour.exe was not produced."
        }
        if (!(Test-Path "./artifacts/windows/wwwroot/_content/Valour.Client/css/bundled.min.css")) {
          throw "Expected Blazor static assets were not found in publish output."
        }

    - name: Verify launcher icon
      shell: pwsh
      run: |
        $icoPath = Join-Path $PWD "Valour/Client.Maui/Platforms/Windows/trayicon.ico"
        if (!(Test-Path $icoPath)) {
          throw "Launcher icon was not found."
        }

    - name: Sign app executable
      uses: sslcom/esigner-codesign@develop
      with:
        command: sign
        username: ${{ secrets.ES_USERNAME }}
        password: ${{ secrets.ES_PASSWORD }}
        credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
        totp_secret: ${{ secrets.ES_TOTP_SECRET }}
        file_path: ${{ github.workspace }}/artifacts/windows/Valour.exe
        override: true

    # The launcher refuses to install an app archive whose Valour.exe is not
    # signed by the launcher's own publisher.
    - name: Create app archive
      shell: pwsh
      run: Compress-Archive -Path ./artifacts/windows/* -DestinationPath ./artifacts/Valour-windows-x64.zip -Force

    - name: Publish launcher
      run: >
        dotnet publish Valour/BuildTools/WindowsLauncher/Valour.WindowsLauncher.csproj
        -c Release
        -r win-x64
        -p:Version=${{ needs.check-version.outputs.version }}
        -p:InformationalVersion=v${{ needs.check-version.outputs.version }}
        -o ./artifacts/launcher

    - name: Sign launcher executable
      uses: sslcom/esigner-codesign@develop
      with:
        command: sign
        username: ${{ secrets.ES_USERNAME }}
        password: ${{ secrets.ES_PASSWORD }}
        credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
        totp_secret: ${{ secrets.ES_TOTP_SECRET }}
        file_path: ${{ github.workspace }}/artifacts/launcher/Valour.exe
        override: true

    - name: Create release files
      shell: pwsh
      run: |
        Copy-Item ./artifacts/launcher/Valour.exe ./artifacts/ValourLauncher.exe -Force

        # Launchers from before 0.9.9 download Valour-full.zip, which holds the
        # launcher with the app archive appended, followed by the payload length
        # and a "VALOURP1" marker. Appending data after signing invalidates the
        # launcher's signature on this file. Those launchers only extract the
        # payload and never run this file, and the Valour.exe inside the payload
        # is signed. Newer launchers use Valour-windows-x64.zip instead.
        $outputPath = Join-Path $PWD "artifacts/Valour-full.exe"
        $payloadPath = Join-Path $PWD "artifacts/Valour-windows-x64.zip"
        Copy-Item ./artifacts/launcher/Valour.exe $outputPath -Force

        $payloadLength = (Get-Item $payloadPath).Length
        $lengthBytes = [System.BitConverter]::GetBytes([Int64]$payloadLength)
        $markerBytes = [System.Text.Encoding]::ASCII.GetBytes("VALOURP1")

        $outStream = [System.IO.File]::Open($outputPath, [System.IO.FileMode]::Append, [System.IO.FileAccess]::Write, [System.IO.FileShare]::Read)
        $payloadStream = [System.IO.File]::OpenRead($payloadPath)
        $payloadStream.CopyTo($outStream)
        $outStream.Write($lengthBytes, 0, $lengthBytes.Length)
        $outStream.Write($markerBytes, 0, $markerBytes.Length)
        $payloadStream.Dispose()
        $outStream.Dispose()

        Compress-Archive -Path $outputPath -DestinationPath ./artifacts/Valour-full.zip -Force

    # Check the files exactly as they are uploaded, after all packaging steps.
    - name: Verify signatures
      shell: pwsh
      run: |
        $verifyDir = "./artifacts/verify"
        Expand-Archive ./artifacts/Valour-windows-x64.zip -DestinationPath $verifyDir -Force

        foreach ($path in @("./artifacts/ValourLauncher.exe", "$verifyDir/Valour.exe")) {
          $sig = Get-AuthenticodeSignature -FilePath $path
          Write-Host "${path}: $($sig.Status) ($($sig.SignerCertificate.Subject))"
          if ($sig.Status -ne "Valid") {
            throw "$path is not validly signed: $($sig.StatusMessage)"
          }
        }

    - name: Create or update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ needs.check-version.outputs.version }}
        name: Valour v${{ needs.check-version.outputs.version }}
        files: |
          ./artifacts/Valour-windows-x64.zip
          ./artifacts/Valour-full.zip
          ./artifacts/ValourLauncher.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
