name: iOS Build

# Builds the iPhone and iPad app, signs it with the Valour Software LLC Apple
# Distribution certificate, and uploads it to App Store Connect, where it
# appears in TestFlight and can be submitted for review. Run it by hand on a
# version branch to check the build and signing before merging; only runs on
# main upload.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Valour/Client.Maui/**'
      - 'Valour/Client/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  build-ios:
    # The .NET for iOS workload requires Xcode 26.6.
    runs-on: macos-26
    timeout-minutes: 90
    env:
      SIGNING_IDENTITY: "Apple Distribution: Valour Software LLC (3BRGSQ2N5K)"

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

    - name: Restore Village release atlas
      run: python3 Tools/Villages/restore-release-assets.py

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # The installer needs the full SDK version; global.json names the release.
        dotnet-version: 11.0.100-rc.1.26425.128

    # Restore evaluates every target framework in the project (Android, iOS,
    # and Mac Catalyst), so all three workloads are needed even though only the
    # iOS app is built.
    - name: Install MAUI workloads
      run: dotnet workload install maui-ios maui-maccatalyst maui-android

    - name: Get short SHA
      id: short-sha
      run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

    - name: Replace asset version hashes
      uses: mingjun97/file-regex-replace@v1
      with:
        regex: '\$\(SHORTHASH\)'
        replacement: '${{ steps.short-sha.outputs.short_sha }}'
        flags: "g"
        include: '\.(js|cs|razor|cshtml|html)$'
        exclude: '.^'
        encoding: 'utf8'
        path: '.'

    # The certificate goes into a temporary keychain that only this job uses.
    - name: Install signing certificate and profile
      env:
        CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
        CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      run: |
        KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
        KEYCHAIN_PASSWORD=$(uuidgen)
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

        echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
        rm "$RUNNER_TEMP/cert.p12"

        # The intermediate that issued the certificate, so codesign can build the chain.
        curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
        security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN"

        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
        security find-identity -v -p codesigning "$KEYCHAIN"

        # The build looks the profile up by name in both of Xcode's profile folders.
        echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
        for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
          mkdir -p "$dir"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/valour-app-store.mobileprovision"
        done

        security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
        PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
        echo "Using provisioning profile: $PROFILE_NAME"
        echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

    - name: Restore dependencies
      run: |
        dotnet restore Valour/BuildTools/CssBundler/CssBundler.csproj
        dotnet restore Valour/Client/Valour.Client.csproj

    - name: Build Client (generates CSS bundle)
      run: dotnet build Valour/Client/Valour.Client.csproj -c Release --no-restore

    - name: Publish iOS app
      run: >
        dotnet publish Valour/Client.Maui/Valour.Client.Maui.csproj
        -f net11.0-ios
        -c Release
        -p:EnableAppleTargetFrameworks=true
        -p:RuntimeIdentifier=ios-arm64
        -p:ArchiveOnBuild=true
        -p:CodesignKey="$SIGNING_IDENTITY"
        -p:CodesignProvision="$PROFILE_NAME"

    - name: Find and verify the package
      run: |
        IPA=$(find Valour/Client.Maui/bin/Release/net11.0-ios -name '*.ipa' -path '*publish*' | head -n 1)
        if [ -z "$IPA" ]; then
          echo "::error::The publish produced no .ipa."
          exit 1
        fi
        echo "IPA=$IPA" >> "$GITHUB_ENV"

        mkdir -p "$RUNNER_TEMP/ipa"
        unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
        APP=$(find "$RUNNER_TEMP/ipa/Payload" -maxdepth 1 -name '*.app' | head -n 1)
        codesign --verify --deep --strict "$APP"
        codesign -dvv "$APP" 2>&1 | grep -E "Authority=Apple Distribution"
        /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" "$APP/Info.plist"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: valour-ios-ipa
        path: ${{ env.IPA }}
        retention-days: 7

    # A manual run on another branch checks the build and signing without
    # uploading. App Store Connect refuses a build number it has already
    # received, so a main run that only touched other files is skipped there.
    - name: Upload to App Store Connect
      if: github.ref == 'refs/heads/main'
      env:
        ASC_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      run: |
        mkdir -p "$HOME/.appstoreconnect/private_keys"
        echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"

        set +e
        xcrun altool --upload-app --type ios --file "$IPA" \
          --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/upload.log"
        STATUS=${PIPESTATUS[0]}
        set -e

        if [ "$STATUS" -ne 0 ]; then
          if grep -qiE "bundle version must be higher|has already been (used|uploaded)" "$RUNNER_TEMP/upload.log"; then
            echo "::notice::App Store Connect already has this build number. Raise ApplicationVersion to upload a new build."
            exit 0
          fi
          echo "::error::The upload to App Store Connect failed."
          exit 1
        fi

    - name: Remove signing keychain
      if: always()
      run: |
        security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
        rm -rf "$HOME/.appstoreconnect/private_keys"
