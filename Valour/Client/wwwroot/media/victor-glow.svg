        <linearGradient id="victor-glow-gradient" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#bf06fd"/>
            <stop offset="1" stop-color="#00faff"/>
        </linearGradient>
        <linearGradient id="victor-border-gradient" gradientUnits="userSpaceOnUse" x1="0" y1="512" x2="512" y2="0">
            <stop offset="0" stop-color="#bf06fd"/>
            <stop offset="1" stop-color="#00faff"/>
        </linearGradient>
        <filter id="victor-border-glow" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur stdDeviation="3"/>
        </filter>
        <filter id="victor-glow-wide" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="22"/>
        </filter>
        <filter id="victor-glow-tight" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="8"/>
        </filter>
        <filter id="victor-star-glow" x="-300%" y="-300%" width="700%" height="700%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <!-- Small round closing minus the shape: paints the thin seams between the head halves and body black so the glow does not tint them. -->
        <filter id="victor-inner-gaps" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
            <feComponentTransfer result="grown">
                <feFuncA type="linear" slope="20" intercept="-1.5"/>
            </feComponentTransfer>
            <feGaussianBlur in="grown" stdDeviation="5"/>
            <feComponentTransfer result="closed">
                <feFuncA type="linear" slope="20" intercept="-17.5"/>
            </feComponentTransfer>
            <feComposite in="closed" in2="SourceAlpha" operator="out"/>
        </filter>
    </defs>
    <rect width="512" height="512" fill="#000"/>
    <g fill="none" stroke="url(#victor-border-gradient)">
        <rect x="20" y="20" width="472" height="472" rx="84" stroke-width="7" filter="url(#victor-border-glow)"/>
        <rect x="20" y="20" width="472" height="472" rx="84" stroke-width="5"/>
    </g>
    <g fill="#fff" filter="url(#victor-star-glow)">
        <circle cx="43.9" cy="196.4" r="5.6"/>
        <circle cx="365.5" cy="59.3" r="5.8"/>
        <circle cx="397.9" cy="303.9" r="5.5"/>
        <circle cx="450.0" cy="227.9" r="2.2"/>
        <circle cx="82.3" cy="311.4" r="2.0"/>
        <circle cx="172.5" cy="31.7" r="2.3"/>
        <circle cx="277.1" cy="476.6" r="4.8"/>
        <circle cx="179.7" cy="465.9" r="2.0"/>
        <circle cx="431.9" cy="366.2" r="2.4"/>
    </g>
    <use href="#victor-shape" fill="url(#victor-glow-gradient)" filter="url(#victor-glow-wide)" opacity="0.85"/>
    <use href="#victor-shape" fill="url(#victor-glow-gradient)" filter="url(#victor-glow-tight)"/>
    <use href="#victor-holes" fill="#000"/>
    <use href="#victor-shape" fill="#000" filter="url(#victor-inner-gaps)"/>
    <use href="#victor-shape" fill="#fff"/>
</svg>
